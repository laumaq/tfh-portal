name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Tous les jours à 2h UTC
  workflow_dispatch:      # Permet de lancer manuellement

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupérer le code AVEC permissions d'écriture
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Récupère toute l'histoire
      
      # 2. Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          cd scripts
          npm install
      
      # 4. Créer le fichier .env.local temporaire
      - name: Create env file
        run: |
          cd scripts
          cat > .env.local << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME=laumaq
          GITHUB_REPO=tfh-portal
          EOF
          echo "✅ .env.local créé"

      # 5. Test simple d'abord
      - name: Test simple du backup
        id: run-test
        run: |
          cd scripts
          echo "🧪 Test simple..."
          node test-simple.js
          
          # Vérifier si le test a créé un fichier
          if [ -f "../backups/test_backup.json" ]; then
            echo "✅ Test réussi! Fichier créé."
            echo "test_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Test échoué"
            echo "test_success=false" >> $GITHUB_OUTPUT
          fi

      
      # 6. VÉRIFIER avant de commiter
      - name: List backup files
        if: steps.run-backup.outputs.backup_exists == 'true'
        run: |
          echo "📁 Contenu du dossier backups:"
          ls -la backups/
          echo "📄 Dernier fichier:"
          ls -t backups/ | head -1
      
      # 7. Commit et push SEULEMENT si des fichiers existent
      - name: Commit and push backup
        if: steps.run-backup.outputs.backup_exists == 'true'
        run: |
          git config --global user.name "GitHub Backup Bot"
          git config --global user.email "backup-bot@github.com"
          
          # Vérifier qu'il y a des changements
          git add backups/
          
          if git diff --staged --quiet; then
            echo "⚠️ Aucun changement à commiter"
          else
            git commit -m "📦 Backup automatique $(date +'%Y-%m-%d %H:%M')"
            echo "✅ Commit créé"
            git push
            echo "✅ Push réussi"
          fi
