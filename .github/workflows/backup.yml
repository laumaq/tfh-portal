name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Tous les jours à 2h UTC
  workflow_dispatch:      # Permet de lancer manuellement

permissions:
  contents: write  # ⚠️ DONNE LA PERMISSION D'ÉCRIRE

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ⚠️ UTILISE VOTRE TOKEN
      
      # 2. Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          cd scripts
          npm install
      
      # 4. Créer le fichier .env.local
      - name: Create env file
        run: |
          cd scripts
          cat > .env.local << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME=laumaq
          GITHUB_REPO=tfh-portal
          EOF
          echo "✅ .env.local créé"
      
      # 5. Exécuter le script de backup
      - name: Run backup script
        id: run-script
        run: |
          cd scripts
          echo "🚀 Lancement du backup..."
          node backup.js
          
          # Vérifier si un backup a été créé
          if ls ../backups/backup_*.json 1>/dev/null 2>&1; then
            echo "✅ Backup créé avec succès!"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Aucun backup créé"
            echo "success=false" >> $GITHUB_OUTPUT
          fi
      
      # 6. Afficher les résultats
      - name: Show results
        if: steps.run-script.outputs.success == 'true'
        run: |
          echo "📊 Résultats du backup:"
          echo "📁 Dossier backups:"
          ls -la backups/
          echo ""
          echo "📄 Dernier backup:"
          ls -t backups/backup_*.json | head -1
      
      # 7. Commit et push AUTOMATIQUE
      - name: Commit and push
        if: steps.run-script.outputs.success == 'true'
        run: |
          echo "🚀 Préparation du push..."
          git config --global user.name "GitHub Backup Bot"
          git config --global user.email "backup-bot@github.com"
          
          git add backups/
          
          # Créer le commit
          git commit -m "📦 Backup automatique $(date +'%Y-%m-%d')" || echo "⚠️ Aucun changement"
          
          # Pousser les changements
          git push
          echo "✅ Backup poussé sur GitHub!"
