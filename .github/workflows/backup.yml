name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Tous les jours à 2h UTC
  workflow_dispatch:      # Permet de lancer manuellement

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 2. Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # 3. Installer les dépendances DANS scripts/
      - name: Install dependencies
        run: |
          echo "📦 Installation des dépendances..."
          cd scripts
          npm install --production
          echo "✅ Dépendances installées"
          echo "📄 Liste des modules:"
          ls -la node_modules/
      
      # 4. Créer le fichier .env.local
      - name: Create env file
        run: |
          cd scripts
          echo "🔐 Création du fichier .env.local..."
          cat > .env.local << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME=laumaq
          GITHUB_REPO=tfh-portal
          EOF
          echo "✅ .env.local créé"
          echo "Contenu (variables masquées):"
          cat .env.local | sed 's/=.*/=***/'  # Masque les valeurs
      
      # 5. Test simple SANS dépendances externes
      - name: Test sans dépendances
        run: |
          cd scripts
          echo "🧪 Test sans dépendances..."
          
          # Créer un test ultra simple
          cat > test-ultra-simple.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          console.log('=== TEST ULTRA SIMPLE ===');
          
          // 1. Vérifier si .env.local existe
          const envPath = path.join(__dirname, '.env.local');
          console.log('.env.local existe?', fs.existsSync(envPath));
          
          if (fs.existsSync(envPath)) {
            const content = fs.readFileSync(envPath, 'utf8');
            console.log('Taille du fichier:', content.length, 'caractères');
            console.log('Contient SUPABASE_URL?', content.includes('SUPABASE_URL'));
            console.log('Contient GITHUB_TOKEN?', content.includes('GITHUB_TOKEN'));
          }
          
          // 2. Créer un dossier backups
          const backupDir = path.join(__dirname, '..', 'backups');
          if (!fs.existsSync(backupDir)) {
            fs.mkdirSync(backupDir, { recursive: true });
            console.log('📁 Dossier backups créé');
          }
          
          // 3. Créer un fichier test
          const testFile = path.join(backupDir, 'test_simple.json');
          fs.writeFileSync(testFile, JSON.stringify({
            test: 'ok',
            timestamp: new Date().toISOString(),
            message: 'Test réussi sans dépendances'
          }, null, 2));
          
          console.log('✅ Fichier créé:', testFile);
          console.log('📄 Taille:', fs.statSync(testFile).size, 'bytes');
          console.log('=== TEST RÉUSSI ===');
          EOF
          
          # Exécuter le test
          node test-ultra-simple.js
      
      # 6. Vérifier les résultats
      - name: Verify backup folder
        run: |
          echo "📁 Vérification du dossier backups..."
          if [ -d "backups" ]; then
            echo "✅ Dossier backups existe!"
            echo "📄 Contenu:"
            ls -la backups/
            
            # Compter les fichiers
            file_count=$(find backups -name "*.json" | wc -l)
            echo "📊 Nombre de fichiers .json: $file_count"
            
            if [ $file_count -gt 0 ]; then
              echo "backup_exists=true" >> $GITHUB_OUTPUT
            else
              echo "backup_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Dossier backups n'existe pas"
            echo "backup_exists=false" >> $GITHUB_OUTPUT
          fi
        id: verify-backup
      
      # 7. Commit et push (seulement si backup réussi)
      - name: Commit and push backup
        if: steps.verify-backup.outputs.backup_exists == 'true'
        run: |
          echo "🚀 Préparation du commit..."
          git config --global user.name "GitHub Backup Bot"
          git config --global user.email "backup-bot@github.com"
          
          # Ajouter les backups
          git add backups/
          
          # Vérifier s'il y a des changements
          if git diff --staged --quiet; then
            echo "⚠️ Aucun changement à commiter"
          else
            git commit -m "📦 Backup automatique $(date +'%Y-%m-%d %H:%M')"
            echo "✅ Commit créé"
            git push
            echo "✅ Push réussi vers GitHub"
          fi
